<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe Racing — Chase Cam Karts</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/build/three.module.js",
    "three/addons/": "/vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="gl"></canvas>

<div id="standings" class="panel"></div>
<div id="raceInfo" class="panel"></div>

<div id="topCenter">
  <div id="phaseMsg"></div>
  <div id="subMsg"></div>
</div>

<div id="bigCount"></div>
<div id="notice"></div>

<div id="joinWrap">
  <div id="nameRow">
    <label for="nameInput">RACING AS</label>
    <input id="nameInput" type="text" maxlength="14" autocomplete="off" spellcheck="false" placeholder="Your name">
  </div>
  <div id="mapVote">
    <div id="mapVoteTitle">PICK A MAP</div>
    <div id="mapVoteGrid"></div>
    <div id="mapVoteStatus"></div>
  </div>
  <div id="carRow">
    <div class="carLabel">YOUR RIDE</div>
    <div id="styleRow"></div>
    <div id="colorRow"></div>
  </div>
  <button id="joinBtn">JOIN RACE</button>
  <div id="joinMsg"></div>
</div>

<div id="results" class="panel"></div>

<div id="speedo">
  <div id="gauge"><svg viewBox="0 0 200 120" width="200" height="120">
    <path d="M20 105 A85 85 0 0 1 180 105" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="10" stroke-linecap="round"/>
    <path id="gaugeArc" d="M20 105 A85 85 0 0 1 180 105" fill="none" stroke="#ffd54f" stroke-width="10" stroke-linecap="round" stroke-dasharray="267" stroke-dashoffset="267"/>
  </svg>
  <div id="speedVal">0</div><div id="speedUnit">km/h</div></div>
  <div id="boostWrap"><div id="boostBar"></div><span>BOOST · SHIFT</span></div>
</div>

<canvas id="minimap" width="240" height="160"></canvas>

<div id="hint">← → / A D steer &middot; W / ↑ accelerate &middot; SHIFT boost &middot; S brake &middot; SPACE drift &middot; R rescue &middot; C camera</div>

<div id="controls">
  <select id="quality" title="Graphics quality">
    <option value="ultra">Ultra</option>
    <option value="high">High</option>
    <option value="medium">Medium</option>
  </select>
  <button id="muteBtn" title="Toggle sound">🔊</button>
  <button id="leaveBtn" title="Leave the grid" style="display:none">LEAVE</button>
</div>

<div id="fps"></div>

<div id="modeWarn">⚠ Server has no REDIS_URL — this instance runs its own lobby, players may land in different races</div>

<div id="overlay"><div class="box" id="overlayMsg">Loading track&hellip;</div></div>

<script type="module" src="/main.js"></script>
</body>
</html>
